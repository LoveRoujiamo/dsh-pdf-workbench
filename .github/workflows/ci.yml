# Runs the checks that need no Python side: syntax, manifest, and the browser
# module self-test. The engine suites (43 + 48 + 31 checks) need the DSH runtime
# Python and are run locally with `bash scripts/verify.sh`.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check index.js
          node --check catalog.js
          node --check client.js
          node --check client.selftest.mjs
          node --check tests/host-smoke.mjs
          node --check tests/ai-smoke.mjs
      - name: Manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('locale/en.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('locale/zh.json','utf8'))"
          node -e "const s=require('fs').readFileSync('icon.svg','utf8'); if(!s.includes('<svg')||s.includes('<script')) process.exit(1)"
      - name: Client module self-test
        run: node client.selftest.mjs
